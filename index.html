let pool,i,s,w;
function sh(a){a=a.slice();for(let k=a.length;k>1;){const j=Math.floor(Math.random()*k--);[a[k],a[j]]=[a[j],a[k]]}return a}
function menu(){

}
function go(l){pool=sh(l);i=0;s=0;w=[];show()}
function show(){
 if(i>=pool.length)return end();
 const d=pool[i],o=sh(d.o),mu=d.a.length>1;

 const B=[...$.querySelectorAll(".o")],f=document.getElementById("f");
 const fin=ok=>{
  ok?s++:w.push(d);

 };

 });

}

}
